<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelVeil — {% block title %}Test Harness{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Simple top nav (design.md section 3): 4 tabs, single-column pages. -->
  <header class="topbar">
    <span class="brand">PixelVeil</span>
    <nav class="tabs">
      <a href="{{ url_for('upload') }}"     class="tab {{ 'active' if active == 'upload' }}">Upload</a>
      <a href="{{ url_for('processing') }}" class="tab {{ 'active' if active == 'processing' }}">Processing</a>
      <a href="{{ url_for('results') }}"    class="tab {{ 'active' if active == 'results' }}">Results</a>
      <a href="{{ url_for('settings') }}"   class="tab {{ 'active' if active == 'settings' }}">Settings</a>
    </nav>
    <span class="harness-note">local test harness</span>
  </header>

  <main class="screen">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
